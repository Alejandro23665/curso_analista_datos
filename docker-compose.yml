services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: datapath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapath}
      POSTGRES_DB: datapath
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapath -d datapath"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://datapath:${POSTGRES_PASSWORD:-datapath}@db:5432/datapath
      SANDBOX_DB_PASSWORD: ${SANDBOX_DB_PASSWORD:-sandbox_ro_change_me}
      STUDY_HOURS_PER_DAY: ${STUDY_HOURS_PER_DAY:-3}
      APP_TZ: ${APP_TZ:-America/Caracas}
      APP_PASSWORD: ${APP_PASSWORD:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
